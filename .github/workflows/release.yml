name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches programVersion
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          source_version=$(sed -n 's/^let programVersion = "\(.*\)"/\1/p' \
            Sources/DoubaoVoiceRestore/main.swift)
          if [[ "$tag" != "$source_version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match programVersion $source_version" >&2
            exit 1
          fi

      - name: Build the release archive
        run: make package

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
